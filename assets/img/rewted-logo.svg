  <text x="340" y="362" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="72" font-weight="700" fill="#00ff41">root:~#</text>
  <rect x="496" y="300" width="15" height="68" fill="#00ff41" opacity="0.85">
    <animate attributeName="opacity" values="0.85;0;0.85" dur="1.1s" repeatCount="indefinite"/>
  </rect>
